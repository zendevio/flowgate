[package]
name = "flowgate"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "onboard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rstest = "0.25"

[profile.release]
strip = true
lto = "thin"
